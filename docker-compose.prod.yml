# docker-compose.prod.yml
# Production overrides - Grafana Loki logging
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Install Loki Docker plugin:
#      docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
#   2. Set LOKI_URL in .env:
#      LOKI_URL=https://<user-id>:<api-key>@logs-prod-us-central1.grafana.net/loki/api/v1/push
#
# Environment: Production only (ENV=prod)
# See: docs/epics/epic-17-cloud-logging.md

x-loki-options: &loki-options
  loki-url: "${LOKI_URL}"
  loki-retries: "5"
  loki-batch-size: "1200"
  loki-timeout: "5s"

services:
  backend:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=backend,env=prod,project=annie"

  mcp-server:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=mcp-server,env=prod,project=annie"

  telegram-bot:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=telegram-bot,env=prod,project=annie"

  proactive-worker:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=proactive-worker,env=prod,project=annie"

  web:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=web,env=prod,project=annie"

  browser:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=browser,env=prod,project=annie"

  redis:
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: "service=redis,env=prod,project=annie"
