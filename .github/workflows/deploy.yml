name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Specific Directory
        run: |
          # 1. Go to the project folder (set DEPLOY_PATH in repo secrets or runner env)
          cd "${DEPLOY_PATH:-$HOME/annie}"

          # 2. Update the code safely
          echo "Fetching latest code for branch: ${{ inputs.branch }}..."
          git fetch --all
          git checkout ${{ inputs.branch }}
          git pull origin ${{ inputs.branch }}

          # 3. Run your start script (Uses existing .env automatically)
          echo "Starting services..."
          make start

      - name: Healthcheck and Validation
        run: |
          cd "${DEPLOY_PATH:-$HOME/annie}"

          echo "Waiting for services to be ready..."
          sleep 10

          # Retry healthcheck up to 30 times (5 min total)
          MAX_RETRIES=30
          RETRY_DELAY=10

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Healthcheck attempt $i/$MAX_RETRIES..."

            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "✓ Basic health check passed"
              break
            fi

            if [ $i -eq $MAX_RETRIES ]; then
              echo "✗ Health check failed after $MAX_RETRIES attempts"
              docker compose logs --tail=50
              exit 1
            fi

            sleep $RETRY_DELAY
          done

          # Full healthcheck with all components
          echo ""
          echo "Running full healthcheck..."
          FULL_HEALTH=$(curl -sf http://localhost:8001/health/full)
          echo "$FULL_HEALTH" | python3 -m json.tool

          # Validate full health response
          STATUS=$(echo "$FULL_HEALTH" | python3 -c "import sys, json; print(json.load(sys.stdin).get('status', 'unknown'))")
          if [ "$STATUS" != "ok" ]; then
            echo "✗ Full healthcheck status is '$STATUS', expected 'ok'"
            exit 1
          fi
          echo "✓ Full healthcheck passed"

          # Defensive component tests
          echo ""
          echo "Running defensive component tests..."

          # Test MCP server is responding (via backend health)
          echo -n "Testing MCP server connection... "
          MCP_STATUS=$(echo "$FULL_HEALTH" | python3 -c "import sys, json; print(json.load(sys.stdin).get('components', {}).get('mcp_server', 'unknown'))")
          if [ "$MCP_STATUS" = "ok" ]; then
            echo "✓ OK"
          else
            echo "✗ MCP server status: $MCP_STATUS"
            exit 1
          fi

          # Test Redis is connected
          echo -n "Testing Redis connection... "
          REDIS_STATUS=$(echo "$FULL_HEALTH" | python3 -c "import sys, json; print(json.load(sys.stdin).get('components', {}).get('redis', 'unknown'))")
          if [ "$REDIS_STATUS" = "ok" ]; then
            echo "✓ OK"
          else
            echo "✗ Redis status: $REDIS_STATUS"
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "✓ All healthchecks and validations passed"
          echo "========================================="