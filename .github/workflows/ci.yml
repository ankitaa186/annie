name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run backend tests
        run: make test-backend PYTEST_ARGS="--junitxml=test-results/backend.xml"

      - name: Run MCP server tests
        run: make test-mcp PYTEST_ARGS="--junitxml=test-results/mcp.xml"

      - name: Run Telegram bot tests
        run: make test-telegram PYTEST_ARGS="--junitxml=test-results/telegram.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/*.xml'
          check_name: 'Test Results'
          fail_on_failure: true
