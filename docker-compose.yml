version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: annie-backend  # Named image for sharing with proactive-worker
    container_name: annie-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
      - "${BACKEND_DEBUG_PORT:-5678}:5678"  # Debug port (dev only)
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DEBUGGER_PORT=5678
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MCP_SERVER_URL=http://mcp-server:8002
      - LLM_PROVIDER=${LLM_PROVIDER:-grok-4}
      - RESEARCH_LLM_PROVIDER=${RESEARCH_LLM_PROVIDER}
      - GROK_API_KEY=${GROK_API_KEY}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-pro-preview}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-8192}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-1.0}
      - GEMINI_SAFETY_SETTING=${GEMINI_SAFETY_SETTING:-BLOCK_NONE}
      - GEMINI_CONTEXT_CACHE_TTL=${GEMINI_CONTEXT_CACHE_TTL:-300}
      - GROK_LIVE_SEARCH_MODE=${GROK_LIVE_SEARCH_MODE:-auto}
      - GROK_LIVE_SEARCH_MAX_RESULTS=${GROK_LIVE_SEARCH_MAX_RESULTS:-10}
      - GROK_LIVE_SEARCH_COST_ALERT_THRESHOLD=${GROK_LIVE_SEARCH_COST_ALERT_THRESHOLD:-800}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-180}
      - LLM_FAILOVER_TIMEOUT=${LLM_FAILOVER_TIMEOUT:-180}
      - LLM_STREAMING_TIMEOUT=${LLM_STREAMING_TIMEOUT:-180}
      - AGENTIC_MEMORIES_URL=${AGENTIC_MEMORIES_URL}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - LANGFUSE_PROJECT_NAME=${LANGFUSE_PROJECT_NAME:-Annie}
      - LANGFUSE_ENVIRONMENT=${LANGFUSE_ENVIRONMENT:-development}
      # Epic 16 - Home Assistant MQTT Configuration
      - HA_MQTT_BROKER=${HA_MQTT_BROKER}
      - HA_MQTT_PORT=${HA_MQTT_PORT:-1883}
      - HA_MQTT_USERNAME=${HA_MQTT_USERNAME}
      - HA_MQTT_PASSWORD=${HA_MQTT_PASSWORD}
      - HA_MQTT_TOPICS=${HA_MQTT_TOPICS:-annie/alerts/#}
      - HA_MQTT_ALERT_USER_ID=${HA_MQTT_ALERT_USER_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/app
    networks:
      - annie-network
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: annie-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8002}:8002"
      - "${MCP_SERVER_DEBUG_PORT:-5679}:5679"  # Debug port (dev only)
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DEBUGGER_PORT=5679
      - MCP_SERVER_PORT=8002
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - STOCK_API_KEY=${STOCK_API_KEY}
      - AGENTIC_MEMORIES_URL=${AGENTIC_MEMORIES_URL}
      # Epic 15 - Web & Profile tools
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-annie-bot/1.0}
      # Epic 16 - Home Assistant REST API Configuration
      - HA_URL=${HA_URL}
      - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN}
      - HA_CONTROL_ALLOWLIST=${HA_CONTROL_ALLOWLIST}
      - HA_TIMEOUT=${HA_TIMEOUT:-10}
      # Browser Automation
      - BROWSER_SERVICE_URL=http://browser:8003
      # Host Terminal (host-terminal-mcp HTTP bridge)
      - HOST_TERMINAL_URL=${HOST_TERMINAL_URL:-http://host.docker.internal:8099}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-YOUR_USER_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./mcp_server:/app/mcp_server
      - /app/mcp_server/__pycache__
    networks:
      - annie-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: annie-telegram-bot
    ports:
      - "${TELEGRAM_BOT_DEBUG_PORT:-5680}:5680"  # Debug port (dev only)
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DEBUGGER_PORT=5680
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AUTHORIZED_USER_IDS=${AUTHORIZED_USER_IDS}
      - BACKEND_URL=http://backend:8000
      - POLLING_TIMEOUT=${POLLING_TIMEOUT:-30}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - BACKEND_CONNECT_TIMEOUT=${BACKEND_CONNECT_TIMEOUT:-10}
      - BACKEND_SOCK_READ_TIMEOUT=${BACKEND_SOCK_READ_TIMEOUT:-180}
      - TELEGRAM_FIRST_TOKEN_TIMEOUT=${TELEGRAM_FIRST_TOKEN_TIMEOUT:-120}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import telegram_bot; import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./telegram_bot:/app/telegram_bot
    networks:
      - annie-network
    restart: unless-stopped

  proactive-worker:
    image: annie-backend  # Share image with backend, different entrypoint
    container_name: annie-proactive-worker
    command: ["python", "-m", "arq", "api.proactive.worker.WorkerSettings"]
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGENTIC_MEMORIES_URL=${AGENTIC_MEMORIES_URL}
      - LLM_PROVIDER=${LLM_PROVIDER:-grok-4}
      - RESEARCH_LLM_PROVIDER=${RESEARCH_LLM_PROVIDER}
      - GROK_API_KEY=${GROK_API_KEY}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck_worker.py"]
      interval: 240s
      timeout: 90s
      retries: 5
      start_period: 120s  # Allow time for first poll cycle
    volumes:
      - ./backend:/app
    networks:
      - annie-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: annie-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - annie-network
    restart: unless-stopped

  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: annie-browser
    volumes:
      - browser_profiles:/data/profiles
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - BROWSER_ALLOWED_DOMAINS=${BROWSER_ALLOWED_DOMAINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8003/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - annie-network

  redis:
    image: redis:7.2-alpine
    container_name: annie-redis
    # External port 6380 to avoid conflict with other Redis containers on host
    # Internal port remains 6379 for container-to-container communication
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - redis-data:/data
    networks:
      - annie-network
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  annie-network:
    driver: bridge
    name: annie-network

volumes:
  redis-data:
    name: annie-redis-data
  browser_profiles:
    name: annie-browser-profiles
