[pytest]
# Test discovery
testpaths = backend/tests mcp_server/tests telegram_bot/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Default options
addopts =
    -v
    --tb=short
    -ra

# Filter warnings
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning

# Console output
console_output_style = progress

# Ignore directories
norecursedirs =
    .git
    .venv
    __pycache__
    venv
    *.egg-info
