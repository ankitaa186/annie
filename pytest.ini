[pytest]
# Test discovery
testpaths = backend/tests mcp_server/tests telegram_bot/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Default options - exclude e2e tests from regular runs
addopts =
    -v
    --tb=short
    -ra
    --ignore=backend/tests/e2e
    --ignore=mcp_server/tests/e2e
    --ignore=telegram_bot/tests/e2e

# Filter warnings
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning

# Console output
console_output_style = progress

# Ignore directories
norecursedirs =
    .git
    .venv
    __pycache__
    venv
    *.egg-info

# Custom markers
markers =
    e2e: End-to-end tests that require real running services
    integration: Integration tests that use mocks
